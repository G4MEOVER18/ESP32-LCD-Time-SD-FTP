; PlatformIO Project Configuration – ESP32-LCD-Time-SD-FTP
; ESP32-S3 Dashboard: NTP-Uhr, SD-Logging, 1.47" ST7789 (Arduino_GFX), WebServer + FTP.
; Arduino_GFX (aktuell) benötigt Core 3.x (esp32-hal-periman.h); die genutzte
; WiFi.softAP-API ist dort rückwärtskompatibel → pioarduino-Plattform (Core 3.1.x).
;
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
src_dir = src/ESP32S3_LCD_Time_SD

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    xreef/SimpleFTPServer@^2.1.7
